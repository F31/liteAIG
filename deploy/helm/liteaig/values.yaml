image:
  repository: ghcr.io/f31/liteaig
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

existingSecret:
  name: ""
  envFrom: false

# database controls the SQLite-backed Lite management plane. SQLite is a
# single-writer store, so enable it only for a single-replica `mode: all`
# workload (the Lite tier). Split gateway/control replicas must not share one
# SQLite file across pods.
database:
  existingClaim: ""
  storageClass: ""
  size: 1Gi

priorityClass:
  create: false
  name: ""
  value: 1000

topology:
  key: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

drain:
  drainTimeoutSeconds: 30
  streamDrainTimeoutSeconds: 60
  forceShutdownTimeoutSeconds: 70
  terminationGracePeriodSeconds: 90

workloads:
  gateway:
    enabled: true
    mode: gateway
    replicas: 3
    # Attach a shared SQLite database only for a single-replica `mode: all`
    # workload; leave this disabled for split replicas.
    database:
      enabled: false
      dir: /data
    pdb:
      minAvailable: 2
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
      scaleDownStabilizationSeconds: 300
      customMetrics: []
    extraArgs: []
    extraEnv: []
  control:
    enabled: false
    mode: control
    replicas: 2
    database:
      enabled: false
      dir: /data
    pdb:
      minAvailable: 1
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
      scaleDownStabilizationSeconds: 300
      customMetrics: []
    extraArgs: []
    extraEnv: []
