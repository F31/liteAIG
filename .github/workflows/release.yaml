---
name: release

# Tag-triggered container delivery: builds the single self-contained liteaig
# image (embedded Console, no runtime deps), pushes to GHCR, attaches an SPDX
# SBOM, and files a GitHub Release with generated notes.
#
# A manual workflow_dispatch with dry_run=true validates the whole pipeline
# except publication: it builds the image, generates the SPDX SBOM, and uploads
# the SBOM as an artifact, skipping GHCR push and the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + SBOM only; skip GHCR push and GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          # Dry-run exports a local docker-archive instead of pushing to GHCR so
          # the SBOM step can scan the artifact without a registry dependency.
          outputs: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'type=docker,dest=/tmp/liteaig-image.tar' || 'type=registry' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute SBOM image reference
        id: sbom-image
        run: |
          # syft/go-containerregistry reject mixed-case registry references, so
          # always scan the lower-cased image; dry-run scans the local archive.
          LOW="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$DRY" ]; then
            echo "ref=docker-archive:/tmp/liteaig-image.tar" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/${LOW}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}

      - name: Generate SBOM for the built image
        uses: anchore/sbom-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image: ${{ steps.sbom-image.outputs.ref }}
          artifact-name: sbom.spdx.json
          # Place the SBOM in the workspace so the release step can reference it
          # by relative path; anchore defaults to a temp dir outside the checkout.
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM (dry-run artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json

      - name: File GitHub Release with SBOM
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom.spdx.json
