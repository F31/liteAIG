---
name: release

# Tag-triggered container delivery: builds the single self-contained liteaig
# image (embedded Console, no runtime deps), pushes to GHCR, attaches an SPDX
# SBOM, and files a GitHub Release with generated notes.
#
# A manual workflow_dispatch with dry_run=true validates the whole pipeline
# except publication: it builds the image, generates the SPDX SBOM, and uploads
# the SBOM as an artifact, skipping GHCR push and the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + SBOM only; skip GHCR push and GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Dry-run builds into the local daemon (no GHCR push) so the SBOM
          # step can scan the artifact; real tag releases push to GHCR.
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          load: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for the built image
        uses: anchore/sbom-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Dry-run scans the locally loaded image (nothing was pushed to GHCR);
          # real tag releases scan the published registry image.
          image: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && format('docker:ghcr.io/{0}:{1}', github.repository, github.ref_name) || format('ghcr.io/{0}:{1}', github.repository, github.ref_name) }}
          artifact-name: sbom.spdx.json

      - name: Upload SBOM (dry-run artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json

      - name: File GitHub Release with SBOM
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom.spdx.json
