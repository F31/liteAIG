name: sdk-conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-sdk-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Console dist
        run: bash scripts/build-console.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install official SDKs
        run: |
          python -m pip install --upgrade pip pydantic httpx a2a-sdk openai anthropic
          mkdir -p /tmp/a2a

      - name: Run official SDK interop
        env:
          LITEAIG_A2A_SDK_DIR: /tmp/a2a
          LITEAIG_A2A_REPORT: /tmp/interop-report.json
        run: go test ./internal/app -run TestA2AOfficialSDKInterop -v -count=1

      - name: Run official model SDK interop
        env:
          LITEAIG_MODEL_SDK_CONFORMANCE: "1"
          LITEAIG_MODEL_SDK_REPORT: /tmp/model-sdk-interop-report.json
        run: go test ./internal/app -run TestOfficialModelSDKInterop -v -count=1

      - name: Upload interop report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2a-interop-report
          path: /tmp/interop-report.json
          if-no-files-found: ignore

      - name: Upload model SDK interop report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-sdk-interop-report
          path: /tmp/model-sdk-interop-report.json
          if-no-files-found: ignore
