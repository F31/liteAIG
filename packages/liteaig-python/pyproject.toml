[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteaig"
version = "0.1.0"
description = "Dependency-free Python client for LiteAIG Gateway APIs."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LiteAIG" }]

[tool.setuptools]
packages = ["liteaig"]
